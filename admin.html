<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизація та Адмін-панель — Kosenko Tech (KT)</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ff6600;
            --text-color: #e0e0e0;
            --text-muted: #aaaaaa;
            --border-color: #2c2c2c;
            --danger-color: #ff4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 100%;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Екран авторизації (Вхід / Реєстрація) */
        #auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .auth-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-box h2 {
            color: #fff;
            margin-bottom: 20px;
        }

        .auth-box input {
            width: 100%;
            padding: 12px;
            background-color: #121212;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #fff;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .auth-box button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }

        .auth-box button:hover {
            background-color: #e55c00;
        }

        .auth-error {
            color: var(--danger-color);
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }

        .toggle-auth {
            margin-top: 15px;
            font-size: 14px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .toggle-auth span {
            color: var(--accent-color);
            text-decoration: underline;
        }

        /* Основний контент адмінки (спочатку прихований) */
        #admin-content {
            display: none;
        }

        header {
            background: rgba(18, 18, 18, 0.98);
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-color);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 20px;
            align-items: center;
        }

        .nav-menu a {
            color: var(--text-color);
            text-decoration: none;
            transition: color 0.3s;
            font-weight: 500;
            font-size: 15px;
        }

        .nav-menu a:hover {
            color: var(--accent-color);
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-logout:hover {
            background: var(--danger-color);
            color: #fff;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 130px 20px 60px;
        }

        .admin-header {
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .admin-header h1 {
            font-size: 32px;
            color: #fff;
        }

        .admin-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .admin-section h2 {
            font-size: 20px;
            color: #fff;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px 14px;
            background-color: #121212;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            height: 100px;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: #fff;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        .btn-danger {
            background-color: var(--danger-color);
            padding: 8px 14px;
            font-size: 13px;
        }

        #success-message {
            display: none;
            margin-top: 15px;
            color: #00cc66;
            font-weight: bold;
        }

        .admin-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121212;
            padding: 12px 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
            gap: 15px;
        }

        .admin-item-info h4 {
            color: #fff;
            font-size: 16px;
            margin-bottom: 3px;
        }

        .admin-item-info span {
            font-size: 13px;
            color: var(--text-muted);
        }

        footer {
            background-color: #0b0b0b;
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 30px 20px;
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Екран Входу / Реєстрації -->
    <div id="auth-overlay">
        <div class="auth-box">
            <h2 id="auth-title">🔒 Вхід в систему</h2>
            <form id="auth-form">
                <input type="email" id="auth-email" placeholder="Ваш Email" required>
                <input type="password" id="auth-password" placeholder="Пароль" required>
                <button type="submit" id="auth-btn">Увійти</button>
            </form>
            <p id="auth-error" class="auth-error"></p>
            <div class="toggle-auth" id="toggle-auth-btn">
                <span id="toggle-text">Немає акаунта? Зареєструватися</span>
            </div>
        </div>
    </div>

    <!-- Основний контент адмін-панелі -->
    <div id="admin-content">
        <header>
            <div class="nav-container">
                <a href="index.html" class="logo">KT // KOSENKO TECH</a>
                <ul class="nav-menu">
                    <li><a href="index.html">Головна</a></li>
                    <li><a href="works.html">Роботи</a></li>
                    <li><button class="btn-logout" id="logout-btn">Вийти</button></li>
                </ul>
            </div>
        </header>

        <div class="admin-container">
            <div class="admin-header">
                <h1>Панель керування роботами</h1>
            </div>

            <div class="admin-section">
                <h2>Додати нову роботу</h2>
                <form id="add-work-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Назва проєкту</label>
                            <input type="text" id="work-title" required placeholder="Наприклад: Ремонт двигуна">
                        </div>
                        <div class="form-group">
                            <label>Категорія</label>
                            <select id="work-category" required>
                                <option value="" disabled selected>Оберіть категорію</option>
                                <option value="Саморобні трактори">Саморобні трактори</option>
                                <option value="Токарні роботи">Токарні роботи</option>
                                <option value="Виготовлення деталей">Виготовлення деталей</option>
                                <option value="Шліфувальні роботи">Шліфувальні роботи</option>
                                <option value="Ремонт машин та вузлів">Ремонт машин та вузлів</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Посилання на фото (URL)</label>
                            <input type="text" id="work-image" required placeholder="https://...">
                        </div>
                        <div class="form-group">
                            <label>Ціна</label>
                            <input type="text" id="work-price" required placeholder="Наприклад: 2500 грн">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Опис</label>
                        <textarea id="work-desc" required placeholder="Опис послуги..."></textarea>
                    </div>
                    <button type="submit" class="btn" id="submit-btn">Опублікувати</button>
                    <p id="success-message">✅ Успішно додано!</p>
                </form>
            </div>

            <div class="admin-section">
                <h2>Керування роботами (видалення)</h2>
                <div id="admin-works-list">
                    <p style="color: var(--text-muted);">Завантаження...</p>
                </div>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 Kosenko Tech (KT). Усі права захищені.</p>
        </footer>
    </div>

    <!-- Firebase Логіка Авторизації та Бази Даних -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCUV88kb3vrItyu-GHkbQQRm37j4jqIjB0",
            authDomain: "kosenkotech.firebaseapp.com",
            projectId: "kosenkotech",
            storageBucket: "kosenkotech.firebasestorage.app",
            messagingSenderId: "215974797306",
            appId: "1:215974797306:web:756eef756c74ca86520e43",
            measurementId: "G-PPGS2P4JYL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isSignUp = false;

        const toggleAuthBtn = document.getElementById('toggle-auth-btn');
        toggleAuthBtn.addEventListener('click', () => {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').textContent = isSignUp ? "📝 Реєстрація акаунта" : "🔒 Вхід в систему";
            document.getElementById('auth-btn').textContent = isSignUp ? "Зареєструватися" : "Увійти";
            document.getElementById('toggle-text').textContent = isSignUp ? "Вже є акаунт? Увійти" : "Немає акаунта? Зареєструватися";
            document.getElementById('auth-error').style.display = 'none';
        });

        const authForm = document.getElementById('auth-form');
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errorElement = document.getElementById('auth-error');

            try {
                if (isSignUp) {
                    await createUserWithEmailAndPassword(auth, email, password);
                    alert("Реєстрація успішна!");
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                errorElement.style.display = 'block';
                let errorMsg = error.message;
                if (error.code === 'auth/email-already-in-use') {
                    errorMsg = "Цей email вже зареєстрований!";
                } else if (error.code === 'auth/weak-password') {
                    errorMsg = "Пароль занадто слабкий (мінімум 6 символів).";
                } else if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    errorMsg = "Невірний email або пароль.";
                }
                errorElement.textContent = "Помилка: " + errorMsg;
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                loadAdminWorks();
            } else {
                document.getElementById('auth-overlay').style.display = 'flex';
                document.getElementById('admin-content').style.display = 'none';
            }
        });

        const logoutBtn = document.getElementById('logout-btn');
        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => {
                location.reload();
            });
        });

        const form = document.getElementById('add-work-form');
        const successMsg = document.getElementById('success-message');
        const submitBtn = document.getElementById('submit-btn');
        const adminWorksContainer = document.getElementById('admin-works-list');

        async function loadAdminWorks() {
            try {
                const querySnapshot = await getDocs(collection(db, "works"));
                if (querySnapshot.empty) {
                    adminWorksContainer.innerHTML = '<p style="color: var(--text-muted);">Немає робіт.</p>';
                    return;
                }

                adminWorksContainer.innerHTML = '';
                querySnapshot.forEach((documentSnap) => {
                    const work = documentSnap.data();
                    const docId = documentSnap.id;

                    const row = document.createElement('div');
                    row.className = 'admin-item-row';
                    row.innerHTML = `
                        <div class="admin-item-info">
                            <h4>${work.title}</h4>
                            <span>Категорія: <b>${work.category}</b> | Ціна: <b>${work.price || '-'}</b></span>
                        </div>
                        <button class="btn btn-danger delete-btn" data-id="${docId}">Видалити</button>
                    `;
                    adminWorksContainer.appendChild(row);
                });

                document.querySelectorAll('.delete-btn').forEach(button => {
                    button.addEventListener('click', async (e) => {
                        const id = e.target.getAttribute('data-id');
                        if (confirm("Видалити цю роботу?")) {
                            try {
                                await deleteDoc(doc(db, "works", id));
                                loadAdminWorks();
                            } catch (error) {
                                alert("Помилка видалення.");
                            }
                        }
                    });
                });

            } catch (error) {
                console.error("Помилка завантаження:", error);
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = "Публікація...";

            try {
                await addDoc(collection(db, "works"), {
                    title: document.getElementById('work-title').value,
                    category: document.getElementById('work-category').value,
                    image: document.getElementById('work-image').value,
                    price: document.getElementById('work-price').value,
                    desc: document.getElementById('work-desc').value,
                    createdAt: new Date()
                });

                form.reset();
                successMsg.style.display = "block";
                setTimeout(() => { successMsg.style.display = "none"; }, 3000);
                loadAdminWorks();
            } catch (error) {
                alert("Помилка збереження.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Опублікувати";
            }
        });
    </script>
</body>
</html>
