<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель — Kosenko Tech (KT)</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ff6600;
            --text-color: #e0e0e0;
            --text-muted: #aaaaaa;
            --border-color: #2c2c2c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 100%;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background: rgba(18, 18, 18, 0.98);
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-color);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .nav-menu a {
            color: var(--text-color);
            text-decoration: none;
            transition: color 0.3s;
            font-weight: 500;
            font-size: 15px;
        }

        .nav-menu a:hover, .nav-menu a.active {
            color: var(--accent-color);
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 130px 20px 60px;
        }

        .admin-header {
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .admin-header h1 {
            font-size: 32px;
            color: #fff;
        }

        .admin-badge {
            background-color: rgba(255, 102, 0, 0.15);
            color: var(--accent-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(255, 102, 0, 0.3);
        }

        .admin-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .admin-section h2 {
            font-size: 20px;
            color: #fff;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px 14px;
            background-color: #121212;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            height: 100px;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: #fff;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .btn:hover {
            background-color: #e55c00;
            transform: translateY(-2px);
        }

        #success-message {
            display: none;
            margin-top: 15px;
            color: #00cc66;
            font-weight: bold;
        }

        footer {
            background-color: #0b0b0b;
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 30px 20px;
            color: var(--text-muted);
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                align-items: center;
                gap: 10px;
                padding: 12px 10px;
            }
            .logo {
                font-size: 18px;
            }
            .nav-menu {
                gap: 12px;
                font-size: 13px;
                justify-content: center;
                flex-wrap: wrap;
                width: 100%;
            }
            .admin-container {
                padding-top: 160px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">KT // KOSENKO TECH</a>
            <ul class="nav-menu">
                <li><a href="index.html">🏠 Головна</a></li>
                <li><a href="works.html">⚙️ Роботи</a></li>
                <li><a href="gallery.html">📸 Галерея</a></li>
                <li><a href="socials.html">📱 Соцмережі</a></li>
                <li><a href="contacts.html">📞 Контакти</a></li>
                <li><a href="admin.html" class="active">🛠️ Адмін</a></li>
            </ul>
        </div>
    </header>

    <div class="admin-container">
        
        <div class="admin-header">
            <h1>Панель керування сайтом</h1>
            <div class="admin-badge">Режим: Адміністратор</div>
        </div>

        <div class="admin-section">
            <h2>Додати нову роботу / послугу</h2>
            <form id="add-work-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Назва проєкту / деталі</label>
                        <input type="text" id="work-title" required placeholder="Наприклад: Зборка моста міні-трактора">
                    </div>
                    <div class="form-group">
                        <label>Категорія</label>
                        <select id="work-category">
                            <option value="Виробництво техніки">Виробництво техніки</option>
                            <option value="Токарні роботи">Токарні роботи</option>
                            <option value="Ремонт і відновлення">Ремонт і відновлення</option>
                            <option value="Інше">Інше</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Посилання на фото (URL)</label>
                    <input type="text" id="work-image" required placeholder="https://images.unsplash.com/...">
                </div>
                <div class="form-group">
                    <label>Опис процесу або характеристик</label>
                    <textarea id="work-desc" required placeholder="Короткий опис виконаної роботи..."></textarea>
                </div>
                <button type="submit" class="btn" id="submit-btn">Опублікувати на сайті</button>
                <p id="success-message">✅ Роботу успішно додано до бази даних!</p>
            </form>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 Kosenko Tech (KT). Усі права захищені.</p>
    </footer>

    <!-- Firebase скрипти для адмінки -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCUV88kb3vrItyu-GHkbQQRm37j4jqIjB0",
            authDomain: "kosenkotech.firebaseapp.com",
            projectId: "kosenkotech",
            storageBucket: "kosenkotech.firebasestorage.app",
            messagingSenderId: "215974797306",
            appId: "1:215974797306:web:756eef756c74ca86520e43",
            measurementId: "G-PPGS2P4JYL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('add-work-form');
        const successMsg = document.getElementById('success-message');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = "Публікація...";

            const title = document.getElementById('work-title').value;
            const category = document.getElementById('work-category').value;
            const image = document.getElementById('work-image').value;
            const desc = document.getElementById('work-desc').value;

            try {
                await addDoc(collection(db, "works"), {
                    title: title,
                    category: category,
                    image: image,
                    desc: desc,
                    createdAt: new Date()
                });

                form.reset();
                successMsg.style.display = "block";
                setTimeout(() => {
                    successMsg.style.display = "none";
                }, 4000);
            } catch (error) {
                console.error("Помилка додавання: ", error);
                alert("Сталася помилка при збереженні.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Опублікувати на сайті";
            }
        });
    </script>
</body>
</html>
