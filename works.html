<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наші роботи — Kosenko Tech (KT)</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ff6600;
            --text-color: #e0e0e0;
            --text-muted: #aaaaaa;
            --border-color: #2c2c2c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 100%;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background: rgba(18, 18, 18, 0.98);
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-color);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .nav-menu a {
            color: var(--text-color);
            text-decoration: none;
            transition: color 0.3s;
            font-weight: 500;
            font-size: 15px;
        }

        .nav-menu a:hover, .nav-menu a.active {
            color: var(--accent-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 130px 20px 60px;
        }

        .page-title {
            font-size: 36px;
            color: #fff;
            margin-bottom: 10px;
            text-align: center;
        }

        .page-subtitle {
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 30px;
            font-size: 16px;
        }

        /* Стилі для кнопок фільтрів */
        .filters {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .filter-btn.active {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        /* Сітка робіт */
        .works-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .work-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, border-color 0.3s;
        }

        .work-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        .work-img-container {
            width: 100%;
            height: 220px;
            background-color: #0b0b0b;
            overflow: hidden;
        }

        .work-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .work-card:hover .work-img-container img {
            transform: scale(1.05);
        }

        .work-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .work-category {
            display: inline-block;
            background-color: rgba(255, 102, 0, 0.15);
            color: var(--accent-color);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
            align-self: flex-start;
            border: 1px solid rgba(255, 102, 0, 0.3);
        }

        .work-title {
            font-size: 20px;
            color: #fff;
            margin-bottom: 10px;
        }

        .work-desc {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .work-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            margin-top: auto;
        }

        .work-price {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        .empty-text {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            font-size: 16px;
            font-style: italic;
            padding: 40px 0;
        }

        footer {
            background-color: #0b0b0b;
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 30px 20px;
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 60px;
        }

        @media (max-width: 768px) {
            .works-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">KT // KOSENKO TECH</a>
            <ul class="nav-menu">
                <li><a href="index.html">Головна</a></li>
                <li><a href="works.html" class="active">Роботи</a></li>
                <li><a href="gallery.html">Галерея</a></li>
                <li><a href="socials.html">Соцмережі</a></li>
                <li><a href="contacts.html">Контакти</a></li>
            </ul>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title">Наші виконані роботи</h1>
        <p class="page-subtitle">Реалізовані проєкти, зборки техніки та індивідуальні замовлення</p>

        <!-- Кнопки фільтрів -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Всі роботи</button>
            <button class="filter-btn" data-filter="Саморобні трактори">Саморобні трактори</button>
            <button class="filter-btn" data-filter="Токарні роботи">Токарні роботи</button>
            <button class="filter-btn" data-filter="Виготовлення деталей">Виготовлення деталей</button>
            <button class="filter-btn" data-filter="Шліфувальні роботи">Шліфувальні роботи</button>
            <button class="filter-btn" data-filter="Ремонт машин та вузлів">Ремонт машин та вузлів</button>
        </div>

        <!-- Єдина сітка робіт для фільтрації -->
        <div id="works-grid" class="works-grid">
            <div class="empty-text">Завантаження...</div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Kosenko Tech (KT). Усі права захищені.</p>
    </footer>

    <!-- Підключення Firebase та скрипт фільтрації -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCUV88kb3vrItyu-GHkbQQRm37j4jqIjB0",
            authDomain: "kosenkotech.firebaseapp.com",
            projectId: "kosenkotech",
            storageBucket: "kosenkotech.firebasestorage.app",
            messagingSenderId: "215974797306",
            appId: "1:215974797306:web:756eef756c74ca86520e43",
            measurementId: "G-PPGS2P4JYL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allWorks = []; // Зберігатимемо всі завантажені роботи

        async function initWorksPage() {
            const gridContainer = document.getElementById('works-grid');
            const filterButtons = document.querySelectorAll('.filter-btn');

            try {
                const querySnapshot = await getDocs(collection(db, "works"));
                
                if (querySnapshot.empty) {
                    gridContainer.innerHTML = '<div class="empty-text">Наразі немає доданих робіт.</div>';
                    return;
                }

                allWorks = [];
                querySnapshot.forEach((doc) => {
                    allWorks.push(doc.data());
                });

                // Відображаємо всі роботи за замовчуванням
                renderWorks('all');

                // Налаштування подій для кнопок фільтрації
                filterButtons.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        // Знімаємо клас active з усіх кнопок та додаємо на натиснуту
                        filterButtons.forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');

                        const filterValue = e.target.getAttribute('data-filter');
                        renderWorks(filterValue);
                    });
                });

            } catch (error) {
                console.error("Помилка завантаження робіт:", error);
                gridContainer.innerHTML = '<div class="empty-text">Помилка завантаження даних. Спробуйте пізніше.</div>';
            }
        }

        function renderWorks(categoryFilter) {
            const gridContainer = document.getElementById('works-grid');
            gridContainer.innerHTML = '';

            // Фільтруємо масив робіт
            const filteredWorks = categoryFilter === 'all' 
                ? allWorks 
                : allWorks.filter(work => work.category === categoryFilter);

            if (filteredWorks.length === 0) {
                gridContainer.innerHTML = '<div class="empty-text">Немає робіт у цій категорії.</div>';
                return;
            }

            filteredWorks.forEach(work => {
                const card = document.createElement('div');
                card.className = 'work-card';
                card.innerHTML = `
                    <div class="work-img-container">
                        <img src="${work.image || 'https://via.placeholder.com/400x220'}" alt="${work.title}" onerror="this.src='https://via.placeholder.com/400x220'">
                    </div>
                    <div class="work-content">
                        <span class="work-category">${work.category || 'Послуга'}</span>
                        <h3 class="work-title">${work.title}</h3>
                        <p class="work-desc">${work.desc || ''}</p>
                        <div class="work-footer">
                            <span class="work-price">${work.price ? work.price : ''}</span>
                        </div>
                    </div>
                `;
                gridContainer.appendChild(card);
            });
        }

        initWorksPage();
    </script>
</body>
</html>
